name: Probar Open Food Facts
on:
  push:
    branches: [prueba-off]
jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - name: Probar endpoints
        run: |
          U='https://search.openfoodfacts.org/search?q=arepa&page_size=3&langs=es&fields=code,product_name,product_name_es,brands,nutriments,serving_size,serving_quantity,countries_tags'
          echo "=== GET con Origin"; curl -s -m 30 -H 'Origin: https://hydromww.github.io' -D - -o b.txt "$U"; head -c 1500 b.txt; echo
          echo "=== OPTIONS"; curl -s -m 30 -X OPTIONS -H 'Origin: https://hydromww.github.io' -H 'Access-Control-Request-Method: GET' -D - -o /dev/null "$U"
          echo "=== Colombia filtro"; curl -s -m 30 'https://search.openfoodfacts.org/search?q=arepa%20countries_tags:%22en:colombia%22&page_size=3&fields=code,product_name,brands,countries_tags' | head -c 800; echo
          echo "=== search.pl otra vez"; curl -s -m 30 -o /dev/null -w '%{http_code}\n' 'https://world.openfoodfacts.org/cgi/search.pl?search_terms=arepa&json=1&page_size=3'
