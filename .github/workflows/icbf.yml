# Descarga la Tabla de Composición de Alimentos Colombianos (ICBF) y la guarda
# en esta rama, para poder convertirla en datos para la app.
name: Descargar tabla ICBF

on:
  push:
    branches: [datos-icbf]
    paths: ['.github/workflows/icbf.yml']

permissions:
  contents: write

jobs:
  descargar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descargar PDF
        run: |
          mkdir -p datos
          curl -fL --retry 3 -A "Mozilla/5.0" -o datos/tcac_web.pdf https://www.icbf.gov.co/system/files/tcac_web.pdf
          ls -la datos
      - name: Extraer texto
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
          pdfinfo datos/tcac_web.pdf | tee datos/tcac_info.txt
          pdftotext -layout datos/tcac_web.pdf datos/tcac_web.txt
      - name: Guardar en la rama
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add datos
          git commit -m "Tabla ICBF descargada"
          git push
